name: CB21
options:
  bundleIdPrefix: com.ramyyasser
  deploymentTarget:
    macOS: "14.0"
packages:
  CB21:
    path: .
targets:
  CB21:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: CB21
        product: CB21Core
    info:
      path: App/Info.plist
      properties:
        CFBundleName: CB21
        CFBundleDisplayName: CB21
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "Copyright © 2026 Ramy Yasser. Free software under the GNU GPL v3."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ramyyasser.cb21
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
